[package]
name = "devjournal-mcp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "devjournal-mcp"
path = "src/main.rs"

[dependencies]
chrono.workspace = true
clap.workspace = true
devjournal-core = { path = "../devjournal-core" }
rmcp = { version = "3.11.0", default-features = false, features = ["macros", "schemars", "server", "transport-io"] }
serde.workspace = true
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
tempfile = "3"
